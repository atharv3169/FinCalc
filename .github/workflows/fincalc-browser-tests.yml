name: FinCalc browser and Python formula checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JavaScript browser calculation parity tests
        run: node --test web/core.test.mjs
      - name: Python CLI original regression suite
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
